<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>数据后台（菜单规划原型）</title>
<style>
:root{--bg:#f6f7f5;--panel:#fff;--fg:#1d2a25;--mut:#6a7873;--line:#e1e6e3;--acc:#1f6b4c;--acc2:#e8f2ec;--up:#1f8a5b;--down:#c4453a;--warn:#b7791f;
--c1:#2f7d5b;--c2:#d9822b;--c3:#3b6fb6;--c4:#9a5bb5;--c5:#c2485a;--c6:#7a8b94;--grid:#e6ebe8}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#131917;--panel:#1b2420;--fg:#e4ece8;--mut:#93a39c;--line:#2a3631;--acc:#58c28f;--acc2:#1f3029;--up:#4fc58a;--down:#ef7b70;--warn:#e0b05a;--c1:#58c28f;--c2:#e89a4d;--c3:#6f9bdc;--c4:#bf8ad8;--c5:#e87b8d;--c6:#9aaab3;--grid:#27322d;color-scheme:dark}}
:root[data-theme=dark]{--bg:#131917;--panel:#1b2420;--fg:#e4ece8;--mut:#93a39c;--line:#2a3631;--acc:#58c28f;--acc2:#1f3029;--up:#4fc58a;--down:#ef7b70;--warn:#e0b05a;--c1:#58c28f;--c2:#e89a4d;--c3:#6f9bdc;--c4:#bf8ad8;--c5:#e87b8d;--c6:#9aaab3;--grid:#27322d;color-scheme:dark}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.app{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);padding:16px 10px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-weight:700;font-size:15px;padding:4px 10px 2px}.brand small{display:block;color:var(--mut);font-weight:400;font-size:12px}
.nav{margin-top:12px;display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;padding:8px 10px;border-radius:8px;color:var(--fg);display:flex;justify-content:space-between;gap:8px}
.nav button:hover{background:var(--acc2)}.nav button.on{background:var(--acc);color:#fff}
.nav button i{font-style:normal;font-size:12px;opacity:.7}
main{padding:16px max(16px,env(safe-area-inset-right,0px)) 48px 24px;min-width:0}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;border-bottom:1px solid var(--line)}
.top .grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.top label{color:var(--mut);font-size:12px}
select,input[type=date],.pill{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font:inherit;font-size:13px}
.pill{cursor:pointer}.pill.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.sample{margin-left:auto;font-size:12px;color:var(--warn);border:1px dashed var(--warn);border-radius:8px;padding:3px 8px}
h1{font-size:22px;margin:20px 0 4px}.q{color:var(--mut);margin:0 0 16px;max-width:70ch}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.tile .n{color:var(--mut);font-size:12px}.tile .v{font-size:26px;font-weight:700;margin:2px 0}
.tile .d{font-size:12px;color:var(--mut);display:flex;gap:10px;flex-wrap:wrap}
.u{color:var(--up)}.dn{color:var(--down)}
.tile .m{margin-top:8px;border-top:1px dashed var(--line);padding-top:6px;font-size:12px;color:var(--mut)}
.tile .m b{font-weight:600;color:var(--fg)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.card h3{margin:0 0 2px;font-size:15px}.card .s{color:var(--mut);font-size:12px;margin-bottom:8px}
.card svg{width:100%;height:auto;display:block}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:6px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.fun{display:flex;flex-direction:column;gap:6px}
.fun .r{display:grid;grid-template-columns:110px 1fr 120px;gap:8px;align-items:center;font-size:13px}
.fun .b{height:22px;border-radius:5px;background:var(--c1);min-width:2px}
.fun .p{color:var(--mut);font-size:12px;text-align:right}
.heat{width:100%;border-collapse:collapse;font-size:12px}.heat td,.heat th{padding:5px 6px;text-align:center;border:1px solid var(--panel)}
.heat th{color:var(--mut);font-weight:500}
details{margin-top:16px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
summary{cursor:pointer;font-weight:600}
.tw{overflow-x:auto;margin-top:8px}
table.t{border-collapse:collapse;width:100%;min-width:760px;font-size:12.5px}
.t th{background:var(--acc2);text-align:left;padding:6px 8px;white-space:nowrap}.t td{padding:6px 8px;border-top:1px solid var(--line);vertical-align:top}
.tag{display:inline-block;background:var(--acc2);color:var(--acc);border-radius:6px;padding:0 6px;font-size:12px}
code{font:12px ui-monospace,monospace;background:var(--acc2);padding:0 4px;border-radius:4px}
.note{background:var(--acc2);border-radius:10px;padding:8px 12px;font-size:12.5px;color:var(--mut);margin:0 0 14px}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.tabs button{all:unset;cursor:pointer;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel)}
.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 10px}
.bar input[type=text]{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font:inherit;font-size:13px;min-width:200px}
.bar .c{color:var(--mut);font-size:12px;margin-left:auto}
table.l{border-collapse:collapse;width:100%;min-width:900px;font-size:13px}
.l th{background:var(--acc2);text-align:right;padding:8px 10px;white-space:nowrap;cursor:pointer;user-select:none;position:sticky;top:0}
.l th:first-child,.l td:first-child{text-align:left}.l th.s{color:var(--acc)}
.l td{padding:8px 10px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
.l tbody tr{cursor:pointer}.l tbody tr:hover{background:var(--acc2)}
.l td:first-child{font-weight:600;color:var(--acc)}
.pg{display:flex;gap:6px;justify-content:flex-end;margin-top:10px;align-items:center;font-size:13px;color:var(--mut)}
.pg button{all:unset;cursor:pointer;padding:3px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg)}
.pg button[disabled]{opacity:.4;cursor:default}.pg button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.dr{position:fixed;top:0;right:0;bottom:0;width:min(520px,100vw);background:var(--panel);border-left:1px solid var(--line);box-shadow:-8px 0 24px #0003;z-index:20;overflow:auto;padding:16px 18px 32px;padding-bottom:max(32px,env(safe-area-inset-bottom,0px))}
.dr.prd{width:min(920px,100vw)}.prd h3{margin:18px 0 6px;font-size:15px}.prd ul{margin:4px 0;padding-left:20px}.prd li{margin:3px 0}.muted{color:var(--mut,#888)}.prdb{padding:4px 8px 12px}.dr h2{margin:0 0 2px;font-size:18px}.dr .x{all:unset;cursor:pointer;float:right;padding:2px 10px;border:1px solid var(--line);border-radius:6px}
.mg{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:12px 0}
.mg div{background:var(--bg);border-radius:8px;padding:8px 10px}.mg b{display:block;font-size:17px}.mg span{font-size:12px;color:var(--mut)}

.src{display:inline-block;border-radius:6px;padding:0 6px;font-size:12px}
.src.a{background:var(--acc2);color:var(--acc)}.src.b{background:#e8eef9;color:#3b6fb6}.src.c{background:#fbeede;color:#b7791f}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .src.b{background:#22304a;color:#8fb3ea}:root:not([data-theme=light]) .src.c{background:#40321c;color:#e0b05a}}
.cv{display:inline-block;height:8px;border-radius:4px;background:var(--c1);vertical-align:middle;margin-right:6px}
.gh{color:var(--mut);font-size:12px;padding:10px 10px 2px;letter-spacing:.05em}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:14px}
.kp .tile{cursor:pointer}.kp .tile.on{outline:2px solid var(--acc)}.kp svg{width:100%;height:34px;margin-top:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}.chips button{all:unset;cursor:pointer;padding:3px 10px;border:1px solid var(--line);border-radius:999px;font-size:12.5px;background:var(--panel)}.chips button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.alerts{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:10px;padding:8px 12px;margin-bottom:14px;font-size:13px}
.dn2{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.ctl{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.ctl label{color:var(--mut);font-size:12px;margin-right:4px}
.st{display:inline-block;border-radius:6px;padding:0 6px;font-size:12px}.st.ok{background:var(--acc2);color:var(--acc)}.st.w{background:#fbeede;color:#b7791f}.st.d{background:#e8eef9;color:#3b6fb6}

.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:16px 0 8px}.ph h1{margin:2px 0 0}.bc{color:var(--mut);font-size:12px}
.acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.upd{font-size:12px;color:var(--mut)}
.btn{all:unset;cursor:pointer;padding:4px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);font-size:13px}.btn:hover{border-color:var(--acc);color:var(--acc)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:8px;z-index:60;font-size:13px;max-width:90vw}
.vw .vt{float:right;display:flex;gap:0;margin:-34px 0 0}.vt button{all:unset;cursor:pointer;padding:1px 10px;font-size:12px;border:1px solid var(--line);background:var(--panel)}.vt button:first-child{border-radius:6px 0 0 6px}.vt button:last-child{border-radius:0 6px 6px 0;border-left:0}.vt button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.vtb{max-height:260px;overflow:auto}.vtb table{border-collapse:collapse;width:100%;font-size:12px}.vtb th{background:var(--acc2);position:sticky;top:0;padding:4px 8px;text-align:right}.vtb td{padding:4px 8px;border-top:1px solid var(--line);text-align:right}.vtb th:first-child,.vtb td:first-child{text-align:left}
.hint{color:var(--mut);font-size:12px}.lostrow{cursor:pointer}.lostrow:hover .b{opacity:.8}
.fbar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:13px}
.stabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin:4px 0 14px;flex-wrap:wrap}.stabs button{all:unset;cursor:pointer;padding:8px 2px;color:var(--mut);border-bottom:2px solid transparent}.stabs button.on{color:var(--acc);border-bottom-color:var(--acc);font-weight:600}
.fv{display:flex;flex-direction:column}.fvr{display:grid;grid-template-columns:150px minmax(0,1fr) 120px;gap:10px;align-items:center;font-size:13px}.fvt{background:var(--bg);border-radius:6px;height:30px;display:flex;justify-content:center}.fvb{background:var(--c1);border-radius:6px;height:100%}.fvc{text-align:center;color:var(--mut);font-size:11.5px;margin:3px 0}.fvv{text-align:right}.fvv em{font-style:normal;color:var(--mut);font-size:12px}
.dimbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px}.dimbar .chips{margin:0}
@media(max-width:820px){.fvr{grid-template-columns:90px minmax(0,1fr) 88px}}
@media(max-width:820px){.app{grid-template-columns:1fr}aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}.nav{flex-direction:row;overflow-x:auto}.nav button{white-space:nowrap}main{padding-left:max(16px,env(safe-area-inset-left,0px))}.fun .r{grid-template-columns:84px 1fr 96px}.grid{grid-template-columns:1fr}}
/* ===== polish ===== */
:root{--sh:0 1px 2px rgba(20,40,32,.05),0 4px 16px rgba(20,40,32,.05);--r:14px}
body{font-size:14px;line-height:1.65;-webkit-font-smoothing:antialiased;letter-spacing:.01em}
.app{grid-template-columns:232px minmax(0,1fr)}
aside{padding:20px 12px;background:var(--panel)}
.brand{font-size:17px;padding:6px 12px 14px;border-bottom:1px solid var(--line);margin-bottom:6px;letter-spacing:.02em}
.nav{margin-top:8px;gap:3px}
.nav button{padding:9px 12px;border-radius:10px;font-size:14px;transition:background .15s,color .15s}
.nav button.on{box-shadow:0 2px 8px rgba(31,107,76,.25);font-weight:600}
.nav button i{background:rgba(127,140,134,.15);border-radius:999px;padding:0 8px;line-height:20px;opacity:.9}
.nav button.on i{background:rgba(255,255,255,.22)}
.gh{padding:16px 12px 4px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.12em}
main{padding:20px 32px 64px 32px;max-width:1500px}
.top{top:0;padding:10px 0 14px;gap:12px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top label{font-weight:500}
select,input[type=date],.pill{border-radius:10px;padding:6px 11px;transition:border-color .15s,box-shadow .15s}
select:hover,input[type=date]:hover{border-color:var(--acc)}
select:focus,input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 20%,transparent)}
.ph{margin:24px 0 14px}
h1{font-size:26px;font-weight:700;letter-spacing:.01em;margin:4px 0 6px}
.q{font-size:14px;line-height:1.7}
.bc{letter-spacing:.04em}
.btn{padding:6px 14px;border-radius:10px;font-weight:500;transition:all .15s}
.btn:hover{background:var(--acc2);transform:translateY(-1px)}
.tiles,.kp{gap:14px;margin-bottom:18px}
.tile,.card,.fbar,.alerts,details{border-radius:var(--r);box-shadow:var(--sh);border-color:var(--line)}
.tile{padding:16px 18px;transition:transform .15s,box-shadow .15s}
.kp .tile:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(20,40,32,.1)}
.tile .n{font-size:12.5px;font-weight:500;letter-spacing:.03em}
.tile .v{font-size:30px;font-weight:700;letter-spacing:-.01em;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.kp .tile.on{outline:2px solid var(--acc);outline-offset:-1px;background:linear-gradient(180deg,var(--acc2),var(--panel) 70%)}
.grid{gap:14px}
.card{padding:18px 20px}
.card h3{font-size:15.5px;font-weight:700;margin:0 0 3px;display:flex;align-items:center;gap:8px}
.card h3::before{content:"";width:4px;height:15px;border-radius:2px;background:var(--acc);flex:none}
.card .s{font-size:12.5px;margin-bottom:12px}
.tabs button,.chips button,.stabs button{transition:all .15s}
.tabs button{padding:7px 16px;font-weight:500}
.tabs button:hover:not(.on){border-color:var(--acc);color:var(--acc)}
.stabs{gap:28px}.stabs button{padding:10px 2px;font-weight:500}.stabs button.on{font-weight:700}
table.l,table.t{font-variant-numeric:tabular-nums}
.l th,.t th{font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--mut);background:color-mix(in srgb,var(--acc2) 70%,var(--panel));border-bottom:1px solid var(--line)}
.l th:first-child{border-top-left-radius:10px}.l th:last-child{border-top-right-radius:10px}
.l td,.t td{padding:10px 12px}
.l tbody tr:nth-child(even),.t tr:nth-child(even) td{background:color-mix(in srgb,var(--bg) 55%,transparent)}
.l tbody tr{transition:background .12s}
.l td:first-child{color:var(--fg)}
.bar input[type=text]{padding:7px 12px;border-radius:10px}
.pg button{border-radius:8px;padding:4px 11px}
.fun .b{border-radius:6px;height:24px}
.fvt{border-radius:8px;height:34px}
.heat td{border-radius:4px}
.alerts{border-left-width:4px;padding:12px 16px}
.dr{border-radius:16px 0 0 16px;box-shadow:-12px 0 40px rgba(0,0,0,.18);padding:24px 26px 40px}
.dr h2{font-size:20px}
.dr .x{border-radius:8px;padding:3px 12px}
.mg div{border-radius:10px;padding:10px 12px}.mg b{font-size:19px;font-variant-numeric:tabular-nums}
.tag,.st,.src{border-radius:6px;padding:1px 8px;font-weight:500}
.toast{border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);padding:10px 20px}
/* PRD */
.dr.prd{width:min(760px,100vw);padding:28px 36px 56px;font-size:14px;line-height:1.8}
.dr.prd h2{font-size:24px;margin-bottom:6px}
.dr.prd h3{font-size:16px;margin:30px 0 10px;padding-bottom:8px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;color:var(--fg)}
.dr.prd h3::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--acc)}
.dr.prd p{margin:8px 0}
.dr.prd ul{margin:6px 0;padding-left:0;list-style:none}
.dr.prd li{position:relative;padding:5px 0 5px 20px}
.dr.prd li::before{content:"";position:absolute;left:5px;top:15px;width:6px;height:6px;border-radius:50%;background:var(--acc);opacity:.7}
.dr.prd .tw{border:1px solid var(--line);border-radius:12px;overflow:auto}
.dr.prd table.t{min-width:560px;margin:0}
.dr.prd table.t td,.dr.prd table.t th{padding:9px 12px}
.dr.prd table.t tr:first-child th{border-top:0}
.dr.prd .muted{color:var(--mut)}
.dr.prd h4{margin:18px 0 6px;font-size:14px;color:var(--acc)}
.vw{max-width:1200px}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--mut) 35%,transparent);border-radius:8px;border:2px solid transparent;background-clip:content-box}
@media(max-width:820px){main{padding:14px 16px 48px}h1{font-size:22px}.dr.prd{padding:20px 18px 40px}.dr{border-radius:0}}
/* ===== typography ===== */
:root{--ff:"PingFang SC","HarmonyOS Sans SC","Noto Sans SC","Source Han Sans SC","Microsoft YaHei UI","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--fn:"SF Pro Display","Segoe UI","Helvetica Neue",Arial,var(--ff)}
body{font-family:var(--ff);font-size:14px;line-height:1.7;color:var(--fg);font-feature-settings:"tnum" 1;text-rendering:optimizeLegibility}
button,select,input{font-family:inherit}
h1,h2,h3,h4{text-wrap:balance;font-weight:700}
h1{font-size:26px;line-height:1.3;letter-spacing:0}
.q{font-size:14.5px;line-height:1.8;color:var(--mut);max-width:62ch;text-wrap:pretty}
.bc{font-size:12px;letter-spacing:.06em;color:var(--mut)}
.tile .v,.mg b,.fun .p b,.l td,.t td,.heat td,.fvr b{font-family:var(--fn);font-variant-numeric:tabular-nums}
.tile .v{font-weight:700;letter-spacing:-.02em}
.tile .n{font-size:13px;color:var(--mut);font-weight:500}
.tile .d,.tile .m{font-size:12.5px;line-height:1.6}
.card h3{font-size:16px;line-height:1.4}
.card .s{font-size:13px;line-height:1.65;color:var(--mut);text-wrap:pretty}
.leg{font-size:12.5px}
.hint,.upd{font-size:12.5px;line-height:1.6}
.nav button{font-size:14px;letter-spacing:.02em}
.gh{font-size:11.5px;font-weight:600;letter-spacing:.14em}
.top label{font-size:12.5px;letter-spacing:.04em}
.l th,.t th{font-size:12.5px;line-height:1.4}
.l td,.t td{font-size:13px;line-height:1.55}
.t td{color:color-mix(in srgb,var(--fg) 92%,var(--bg))}
.alerts,.fbar{font-size:13.5px;line-height:1.7}
.dr{line-height:1.7}
/* PRD document typography */
.dr.prd{font-size:14.5px;line-height:1.85;color:color-mix(in srgb,var(--fg) 94%,var(--bg));font-family:var(--ff)}
.dr.prd h2{font-size:26px;line-height:1.3;margin:4px 0 8px;letter-spacing:0}

function wkheat(c,key){const r=rng(hash(key+S.fp+S.fu+S.fc+S.n)),W=640,H=230,L0=40,cw=(W-L0-8)/24,ch=(H-34)/7,wd=['周一','周二','周三','周四','周五','周六','周日'];let g='';
 for(let d=0;d<7;d++){g+=`<text x="${L0-6}" y="${8+d*ch+ch/2+4}" text-anchor="end" font-size="11" fill="var(--mut)">${wd[d]}</text>`;for(let h=0;h<24;h++){const base=h<6?.12+h*.02:h<9?.35:h<12?.55:h<14?.7:h<18?.55:h<23?.95:.5;const v=Math.min(1,base*(d>4?1.12:1)*(.92+r()*.16));g+=`<rect x="${L0+h*cw}" y="${8+d*ch}" width="${cw-2}" height="${ch-2}" rx="3" fill="color-mix(in srgb,var(--c1) ${(v*100).toFixed(0)}%,var(--panel))"><title>${wd[d]} ${pad(h)}时：活跃指数 ${(v*100).toFixed(0)}</title></rect>`}}
 for(let h=0;h<24;h+=3)g+=`<text x="${L0+h*cw+cw/2}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--mut)">${pad(h)}</text>`;return `<svg viewBox="0 0 ${W} ${H}">${g}</svg>`}
function curve(c,key){const W=640,H=230,L0=44,R0=12,T0=12,B0=28,cats=['次日','3日','7日','15日','30日'],base=[41.5,31.8,23.8,16.9,12.1],ser_=[['全部用户',1],['登录用户',1.25],['游客',.78]],r=rng(hash(key+S.fp+S.fu+S.fc));
 const x=i=>L0+(W-L0-R0)*i/4,y=v=>T0+(H-T0-B0)*(1-v/60);let g='';for(let k=0;k<=4;k++){const v=k*15;g+=`<line x1="${L0}" x2="${W-R0}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${L0-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--mut)">${v}%</text>`}
 cats.forEach((n,i)=>g+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--mut)">${n}</text>`);
 const p=ser_.map(([n,m],si)=>{const d=base.map(v=>v*m*(.97+r()*.06));return `<path d="${d.map((v,i)=>(i?'L':'M')+x(i)+' '+y(v)).join('')}" fill="none" stroke="${COL[si]}" stroke-width="2"/>`+d.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="${COL[si]}"><title>${n} ${cats[i]}留存 ${v.toFixed(1)}%</title></circle>`).join('')}).join('');
 return `<svg viewBox="0 0 ${W} ${H}">${g}${p}</svg>`+legend(ser_.map(a=>a[0]))}

  if(n==='曝光量')return e;if(n==='有效曝光(≥5s)')return Math.round(e*(.55+r()*.2));

 a.push({i,name:t+i,cells,e,det})}return a}

function flowRows(F,dm){return dm.en.map((en,ei)=>{const r=rng(hash(F.id+dm.k+en+S.fp+S.fu+S.fc));const sh=dm.sh[ei]/dm.sh.reduce((a,b)=>a+b,0);
  let v=({active:100000,coin:5200,vip:3100,content:98000,login:9000,search:14000}[F.id])*sh*scale()*(F.id==='active'?1:S.n/14)*(1+(r()-.5)*.12);const c=[v];
  for(let i=1;i<F.steps.length;i++){const k=Math.min(.97,F.steps[i].r*(.86+r()*.28)*WF()*(1+(ei===1&&F.id==='coin'?.1:0)));v=v*k;c.push(v)}
  return {en,c}})}
function flowData(F,dm){const d0=DIMS(F)[0],base=flowRows(F,d0),tot=F.steps.map((_,i)=>base.reduce((a,x)=>a+x.c[i],0));let rows=base;
 if(dm&&dm.k!==d0.k){rows=flowRows(F,dm);const sm=tot.map((_,i)=>rows.reduce((a,x)=>a+x.c[i],0));rows=rows.map(x=>({en:x.en,c:x.c.map((v,i)=>v*tot[i]/sm[i])}))}

function evPg(id){return [...new Set(PAGES.filter(p=>p.ev.some(e=>e.id===id)).map(p=>p.page))].join('、')||'—'}
function bizTxt(s){return (s||'').replace(/\b[a-z]+(?:_[a-z0-9]+)+(?:\.[a-z_]+)?(?:=[a-z0-9_]+)?\b/g,m=>{const e=EVENTS.find(x=>x.id===m.split('.')[0]);return e&&e.name?'「'+e.name+'」':''}).replace(/（登录取 ，游客取 ）/g,'（登录用户按账号、游客按设备去重）').replace(/[（(]\s*[）)]/g,'').replace(/入口事件/g,'入口').replace(/成功事件/g,'成功').replace(/类事件次数/g,'类次数').replace(/付费事件次数/g,'付费次数').replace(/\s{2,}/g,' ').replace(/、、+/g,'、').replace(/；\s*；/g,'；').trim()}
function prdBody(name,full){const P=PRDT[name]||{goal:'',scene:'',layout:[],rules:[],accept:[],todo:[]};const ms=METRICS.filter(x=>x.menu===name);

function csvOut(){const t=$('#view table.l')||$('#view table.heat')||$('#view .vtb table')||$('#view table.t');if(!t){toast('当前页面没有可导出的表格');return}
 const rows=[...t.rows].map(r=>[...r.cells].map(c=>'"'+c.innerText.replace(/\s+/g,' ').trim().replace(/"/g,'""')+'"').join(','));
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.join('\n')],{type:'text/csv'}));a.download=MODS[S.m].name+'.csv';a.click();toast('已导出 '+MODS[S.m].name+'.csv')}
function defOpen(){const m=MODS[S.m],ms=METRICS.filter(x=>x.menu===m.name);const d=document.getElementById('dr');if(d)d.remove();const el=document.createElement('div');el.className='dr';el.id='dr';
 el.innerHTML=`<button class="x" onclick="this.parentNode.remove()">关闭</button><h2>${m.name} · 指标口径</h2><div class="s" style="color:var(--mut);font-size:12px">每个指标怎么算、依赖哪些埋点。共 ${ms.length} 个。</div>`+ms.map(x=>`<div class="card" style="margin-top:10px"><h3>${x.name} <span class="tag">${x.form}</span></h3><div class="s">${x.sub}</div><div style="font-size:13px">${x.f||'—'}</div><div style="margin-top:6px">${x.ev.split('、').map(e=>e?`<code>${e}</code>`:'').join(' ')}</div></div>`).join('');document.body.appendChild(el)}
const CH={sel:[0,1,2]},CHN=['渠道A','渠道B','渠道C','渠道D','渠道E','渠道F','渠道G','渠道H'],CHS=[.3,.22,.15,.1,.08,.06,.05,.04];
function chRow(i){const r=rng(hash('chr'+i+S.fp+S.fu));return {n:CHN[i],nu:Math.round(2800*scale()*S.n/14*CHS[i]*(.9+r()*.2)),d1:30+r()*18,mn:9+r()*10,pay:1.5+r()*4.5,cr:40+r()*25}}
function chTog(i){const k=CH.sel.indexOf(i);if(k>=0){if(CH.sel.length>1)CH.sel.splice(k,1)}else if(CH.sel.length<5)CH.sel.push(i);else toast('最多同时对比 5 个渠道');render()}
function chanCmp(){const R=CHN.map((_,i)=>chRow(i));return `<div class="card" style="margin-top:12px"><h3>渠道对比</h3><div class="s">勾选渠道（最多 5 个），对比新增趋势，并在表里比较留存和付费质量。量大不等于质量好。</div><div class="grid"><div class="tw"><table class="t" style="min-width:420px"><tr><th></th><th>渠道</th><th>新增用户</th><th>次日留存</th><th>人均时长</th><th>看内容率</th><th>付费转化率</th></tr>${R.map((o,i)=>`<tr><td><input type="checkbox" ${CH.sel.includes(i)?'checked':''} onchange="chTog(${i})"></td><td>${o.n}</td><td>${o.nu.toLocaleString()}</td><td>${o.d1.toFixed(1)}%</td><td>${o.mn.toFixed(1)} 分钟</td><td>${o.cr.toFixed(1)}%</td><td>${o.pay.toFixed(1)}%</td></tr>`).join('')}</table></div><div>${line({series:CH.sel.map(i=>({n:CHN[i],base:R[i].nu/S.n,vol:.1}))},'chc')}</div></div></div>`}
function distCards(){const r=rng(hash('dist'+S.fp+S.fu+S.fc)),TT=Math.round(52000*scale()*S.n/14);
 const D=(t,s,cats,w)=>{const ws=w.map(x=>x*(.92+r()*.16)),sm=ws.reduce((a,b)=>a+b,0),mx=Math.max(...ws);return `<div class="card"><h3>${t}</h3><div class="s">${s}</div><div class="fun">${cats.map((c,i)=>`<div class="r"><span>${c}</span><div class="b" style="width:${ws[i]/mx*100}%"></div><span class="p">${(ws[i]/sm*100).toFixed(1)}% · ${Math.round(TT*ws[i]/sm).toLocaleString()}</span></div>`).join('')}</div></div>`};
 return `<div class="grid" style="margin-top:12px">`+D('单次使用时长分布','每次打开 App 用了多久。集中在 10 秒以内，说明首屏没留住人。',['不足 10 秒','10–30 秒','30 秒–1 分','1–3 分','3–10 分','10–30 分','30 分以上'],[.12,.14,.13,.22,.2,.13,.06])+D('每日启动次数分布','一个人一天打开几次。看用户是偶尔来，还是每天多次来。',['1 次','2 次','3–5 次','6–9 次','10 次以上'],[.38,.24,.25,.09,.04])+`</div>`}
const h0=parseInt((location.hash.match(/m(\d+)/)||[])[1]);if(h0>=1&&h0<=MODS.length)S.m=h0-1;
nav();sync();
</script></body></html>
